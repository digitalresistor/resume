name: Resume builder
on:
    push:
        branches:
            - main
    pull_request:
    release:
        types:
            - created

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        # Parity with .pre-commit-config.yaml, so a `--no-verify` commit is
        # still caught on the pull request.
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.x'
            - run: pip install pre-commit
            - run: pre-commit run --all-files --show-diff-on-failure

    build:
        name: LaTeX to PDF
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Build the Docker image
              run: docker build -t pdftex:latest - < Dockerfile
            - name: Build the resume
              # SOURCE_DATE_EPOCH makes pdfTeX stamp the PDF with the commit date
              # rather than the build time, so a rebuild of the same commit is
              # byte-identical and /CreationDate agrees with the filename below.
              # -halt-on-error: without it a missing .sty drops pdftex into its
              # interactive error prompt, which aborts with a misleading message
              # once docker closes stdin.
              run: |
                  docker run --rm -v $(pwd):$(pwd) -w $(pwd) \
                    -e SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct Resume.tex)" \
                    -e FORCE_SOURCE_DATE=1 \
                    pdftex:latest \
                    pdftex -fmt=pdflatex -interaction=nonstopmode -halt-on-error ./Resume.tex
            - name: Validate the PDF text layer for ATS parsing
              # An ATS never sees the rendered page, only the text layer. This
              # fails the build if the email is unparseable, glyphs are mojibake,
              # words are split, sections are out of order, or it runs long.
              run: |
                  docker run --rm -v $(pwd):$(pwd) -w $(pwd) pdftex:latest \
                    python3 tools/ats_check.py --pdf Resume.pdf --log Resume.log \
                                               --require gs,pdftotext
            - name: Upload the build log on failure
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: build-log
                  path: Resume.log
            - name: Rename the Resume to include the current date
              run: |
                  export RESUME_NAME=DeltaRegeer-Resume-$(date -d $(git log -1 --pretty="format:%cI" Resume.tex) "+%Y-%m-%d").pdf
                  mv Resume.pdf $RESUME_NAME
                  echo "RESUME_NAME=${RESUME_NAME}" >> "$GITHUB_ENV"
            - name: Upload artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: Resume
                  path: ${{ env.RESUME_NAME }}
    release:
        runs-on: ubuntu-latest
        if: github.event_name == 'release'
        needs: build
        name: Publish the Resume
        permissions:
            # gh release upload writes to the release. The artifact download
            # uses the separate Actions runtime token, not this one.
            contents: write
        steps:
            - name: Download the Resume artifact
              uses: actions/download-artifact@v8
              with:
                  name: Resume
            - name: Upload the resume to the Github release
              # actions/upload-release-asset is archived (unmaintained since
              # 2021, Node 20, and still emitting the deprecated `set-output`
              # command). gh is preinstalled on the runner, so the upload needs
              # no third-party action at all. --clobber makes a re-run of this
              # job replace the asset instead of failing on the duplicate name.
              # The tag goes through the environment rather than being
              # interpolated into the script, so a tag name cannot inject shell.
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: gh release upload "$RELEASE_TAG" *Resume*.pdf --clobber
